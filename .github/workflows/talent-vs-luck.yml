name: talent-vs-luck tests

on:
  push:
    paths:
      - "talent-vs-luck/**"
      - ".github/workflows/talent-vs-luck.yml"
  pull_request:
    paths:
      - "talent-vs-luck/**"
      - ".github/workflows/talent-vs-luck.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: talent-vs-luck
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: talent-vs-luck
        run: python -m pytest simulation/tests spatial_sim/tests common/tests -v
