[project]
name = "vault-retrieval"
version = "0.1.0"
description = "Obsidian vault embedding & retrieval service (indexer + query API + MCP wrapper)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3.6",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "watchdog>=4.0",
    # Pinned below 2.0: that release reworked the low-level Server API and
    # dropped/relocated FastMCP at the time this was written.
    "mcp>=1.20.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
vault-indexer = "vault_retrieval.indexer.cli:main"
vault-mcp = "vault_retrieval.mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
