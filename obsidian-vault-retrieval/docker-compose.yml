services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vault-retrieval-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vault
      POSTGRES_DB: vault
    ports:
      # Non-default host port to avoid clashing with a local Postgres / the
      # budget-advisor project's Postgres MCP server.
      - "5433:5432"
    volumes:
      - vault-retrieval-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vault"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vault-retrieval-pgdata:
